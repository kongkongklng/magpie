name: Build Magpie 8ecab590 for macOS

on:
  workflow_dispatch:
  push:
    branches:
      - codex/build-issue-batch-1024pm

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run custom tool tests
        run: go test ./internal/gateway -run Custom -count=1

      - name: Build macOS app
        run: make app

      - name: Identify architecture
        run: |
          echo "Runner architecture: $(uname -m)"
          file magpie.app/Contents/MacOS/magpie

      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent magpie.app magpie-macos.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: magpie-macos-8ecab590-${{ runner.arch }}
          path: magpie-macos.zip
          if-no-files-found: error
          retention-days: 14
